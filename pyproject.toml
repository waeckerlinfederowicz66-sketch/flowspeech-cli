[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "flowspeech-cli"
version = "0.2.0"
description = "Command-line client for FlowSpeech public API v1 text to speech."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "FlowSpeech", email = "support@flowspeech.io" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["flowspeech", "text-to-speech", "tts", "voiceover"]

[project.urls]
Homepage = "https://flowspeech.io/"
Documentation = "https://flowspeech.io/docs/public-api"
Repository = "https://github.com/waeckerlinfederowicz66-sketch/flowspeech-cli"

[project.scripts]
flowspeech = "flowspeech_cli.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowspeech_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "RELEASE.md", "PROVENANCE.md", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

