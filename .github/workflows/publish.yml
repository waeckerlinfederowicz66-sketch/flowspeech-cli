name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' build==1.3.0 hatchling==1.27.0 twine==6.2.0
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - name: Freeze built distributions
        id: manifest
        run: |
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          shasum -a 256 dist/*.whl dist/*.tar.gz > SHA256SUMS
          echo "sha256=$(shasum -a 256 SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest -q -o pythonpath=
      - name: Test extracted sdist
        run: |
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test
          (cd sdist-test/* && python -m pytest -q)
      - name: Verify final distribution set
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          printf '%s  SHA256SUMS\n' "$EXPECTED_MANIFEST_SHA256" | shasum -a 256 --check --strict
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          shasum -a 256 --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Verify tested distribution hashes
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
        run: |
          printf '%s  SHA256SUMS\n' "$EXPECTED_MANIFEST_SHA256" | shasum -a 256 --check --strict
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          shasum -a 256 --check --strict SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
